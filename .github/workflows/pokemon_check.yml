name: ポケモン買取価格チェック

on:
  schedule:
    - cron: '0 * * * *'  # 毎時0分（1時間ごと）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - pokemon_scraper.py
      - price_resilience.py
      - discord_notifications.py
      - test_discord_notifications.py
      - test_homura.py
      - test_price_resilience.py
      - test_x_freshness.py
      - tests/**
      - .github/workflows/pokemon_check.yml

permissions:
  contents: write

concurrency:
  group: pokemon-price-check-main
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 必要なライブラリとPlaywrightをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: X価格の有効期限と取得失敗時のテスト
        run: |
          python -m unittest -v test_x_freshness test_homura test_price_resilience test_discord_notifications
          python -m unittest discover -s tests -v

      - name: ポケモン買取価格チェックを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python pokemon_scraper.py --no-notify
          else
            python pokemon_scraper.py
          fi

      - name: 価格履歴とレポートページを保存
        run: |
          git config user.name "pokemon-bot"
          git config user.email "pokemon-bot@users.noreply.github.com"
          git add price_history.json docs/index.html docs/prices.json
          git add x_api_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "価格履歴・レポートを更新"
          git pull --rebase origin main
          git push origin HEAD:main

