name: ポケモン買取価格チェック

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - pokemon_scraper.py

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリとPlaywrightをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: ポケモン買取価格チェックを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_STATE_JSON: ${{ secrets.X_STATE_JSON }}
        run: |
          if [ -n "$X_STATE_JSON" ]; then
            printf '%s' "$X_STATE_JSON" > x_state.json
          else
            echo "::warning::X_STATE_JSON が未設定のためX店舗はスキップされます"
          fi
          python pokemon_scraper.py

      - name: 価格履歴とレポートページを保存
        run: |
          git config user.name "pokemon-bot"
          git config user.email "pokemon-bot@users.noreply.github.com"
          git stash
          git pull origin main --rebase
          git stash pop || echo "No stash to pop"
          git add price_history.json docs/index.html
          git diff --staged --quiet || git commit -m "価格履歴・レポートを更新"
          git push origin main
