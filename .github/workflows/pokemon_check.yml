name: ポケモン買取価格チェック

on:
  schedule:
    - cron: '0 * * * *'  # 毎時0分（1時間ごと）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - pokemon_scraper.py

permissions:
  contents: write

concurrency:
  group: pokemon-price-check-main
  cancel-in-progress: true

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリとPlaywrightをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: ポケモン買取価格チェックを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python pokemon_scraper.py

      - name: 価格履歴とレポートページを保存
        run: |
          git config user.name "pokemon-bot"
          git config user.email "pokemon-bot@users.noreply.github.com"
          git stash
          git pull origin main --rebase
          git stash pop || echo "No stash to pop"
          git add price_history.json docs/index.html
          git add x_api_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "価格履歴・レポートを更新"
          git push origin main
