name: Build Discord Studio
on:
  push:
    branches: [main]
    paths:
      - 'discord-template/src/**'
      - 'discord-template/test/**'
      - 'discord-template/package*.json'
      - '.github/workflows/build-discord-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: discord-template/package-lock.json
      - name: Install, test, and build
        working-directory: discord-template
        run: |
          npm ci
          npm test
          npm run build
      - name: Publish compiled script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/discord-template/app.js
          if ! git diff --cached --quiet; then
            git commit -m "Build Discord Studio for GitHub Pages"
            git push
          fi
