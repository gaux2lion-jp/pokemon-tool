<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUMdex Discord Template Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">SUMdex Sales Tools</p>
      <h1>Discord Template Builder</h1>
      <p>仕入れ登録から価格判定、Discord投稿文の作成までを1画面で行えます。</p>
    </div>
    <a class="ghost-button" href="../index.html">国内買取価格一覧へ</a>
  </header>

  <main>
    <section class="panel settings-panel">
      <div class="section-heading">
        <div><span class="step">設定</span><h2>利益計算</h2></div>
        <span id="dataStatus" class="status loading">国内価格を読込中</span>
      </div>
      <div class="settings-grid">
        <label>最低必要利益<input id="minimumProfit" type="number" min="0" step="100" value="500"><span>円 / BOX</span></label>
        <label>状態値引き上限<input id="discountCap" type="number" min="0" step="100" value="1500"><span>円 / BOX</span></label>
      </div>
      <p class="hint">還付見込額は「税込仕入れ値 × 10 ÷ 110」で計算します。SUMdex価格は商品ごとにこの端末へ記憶されます。</p>
    </section>

    <section class="panel">
      <div class="section-heading"><div><span class="step">STEP 1</span><h2>仕入れを登録</h2></div></div>
      <form id="purchaseForm">
        <div class="form-grid">
          <label class="wide">商品名
            <input id="productName" list="productOptions" autocomplete="off" placeholder="商品名を検索" required>
            <datalist id="productOptions"></datalist>
          </label>
          <label>SUMdex価格
            <input id="sumdexPrice" type="number" min="0" step="100" placeholder="例：13000" required>
            <span>円 / BOX</span>
          </label>
          <label>税込仕入れ値
            <input id="purchasePrice" type="number" min="0" step="1" placeholder="例：11000" required>
            <span>円 / BOX</span>
          </label>
          <label>数量
            <input id="quantity" type="number" min="1" step="1" value="1" required>
            <span>BOX</span>
          </label>
          <label>輸出関連費用
            <input id="expenses" type="number" min="0" step="1" value="0">
            <span>円 / BOX</span>
          </label>
        </div>

        <fieldset>
          <legend>コンディション（ダメージは複数選択できます）</legend>
          <div id="conditionOptions" class="condition-grid">
            <label class="condition clean"><input type="checkbox" value="clean" checked><span>✨ 問題なく綺麗<small>−¥100</small></span></label>
            <label class="condition"><input type="checkbox" value="shrinkSmall"><span>🟡 シュリンク穴・小<small>−¥300</small></span></label>
            <label class="condition"><input type="checkbox" value="shrinkLarge"><span>🟡 シュリンク穴・大<small>−¥500</small></span></label>
            <label class="condition"><input type="checkbox" value="dentSmall"><span>🟠 潰れ・小<small>−¥500</small></span></label>
            <label class="condition"><input type="checkbox" value="dentLarge"><span>🔴 潰れ・大<small>−¥1,000</small></span></label>
            <label class="condition"><input type="checkbox" value="stainSmall"><span>🟠 汚れ・小<small>−¥300</small></span></label>
            <label class="condition"><input type="checkbox" value="stainLarge"><span>🔴 汚れ・大<small>−¥700</small></span></label>
          </div>
        </fieldset>

        <label class="notes-label">状態の補足<textarea id="notes" rows="2" placeholder="例：箱の右上に軽い凹みあり"></textarea></label>
        <button class="primary-button" type="submit">商品を追加して価格を確認</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div><span class="step">STEP 2–4</span><h2>価格確認・掲載商品の選択</h2></div>
        <button id="clearAll" class="text-button" type="button">すべて削除</button>
      </div>
      <div id="emptyState" class="empty-state">商品を登録すると、ここに価格と利益判定が表示されます。</div>
      <div id="items" class="items"></div>
    </section>

    <section class="panel output-panel">
      <div class="section-heading">
        <div><span class="step">STEP 5</span><h2>Discord本文</h2></div>
        <button id="copyButton" class="primary-button" type="button">本文をコピー</button>
      </div>
      <textarea id="output" rows="28" readonly placeholder="掲載する商品を選択すると本文が作成されます。"></textarea>
      <p id="copyStatus" class="copy-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
